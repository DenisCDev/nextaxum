name: Bug report
description: Something is broken in the template
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include any error messages verbatim.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: How can someone else hit this?
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Next 16.2.x / Rust 1.85 / Postgres 16 / OS"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
