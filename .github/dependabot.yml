version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      patches:
        update-types: ["patch"]
      tower-stack:
        patterns:
          - "axum*"
          - "tower*"
          - "tower-*"
          - "hyper*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # Major Next.js bumps need manual coordination with proxy.ts + cache APIs.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
    groups:
      patches:
        update-types: ["patch"]
      types:
        patterns:
          - "@types/*"
      testing:
        patterns:
          - "@testing-library/*"
          - "@playwright/*"
          - "vitest*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
