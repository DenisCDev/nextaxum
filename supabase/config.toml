# Generated by `supabase init` and trimmed to what this template needs.
# Full reference: https://supabase.com/docs/guides/cli/config
#
# Run with `make supabase-up`. Studio at http://localhost:54323.
#
# Migrations live in ../backend/migrations — Supabase CLI applies any *.sql in
# that directory by default via `migration_paths`. Single source of truth so
# `sqlx migrate run` (used by the backend) and `supabase db reset` (used for
# local dev) operate on the same files.

project_id = "nextaxum"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 16

[db.pooler]
enabled = false
port = 54329

[db.migrations]
schema_paths = []
migration_paths = ["../backend/migrations"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Configure providers in the dashboard once your local stack is up. The
# config.toml block for each provider is an alternative — see the docs.
