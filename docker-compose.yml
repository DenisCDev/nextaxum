services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - RUST_LOG=backend=debug,tower_http=debug
    depends_on:
      - migrate

  migrate:
    build: ./backend
    command: ["sqlx", "migrate", "run"]
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL_DIRECT}

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - backend
